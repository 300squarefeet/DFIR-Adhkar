[project]
name = "adhkar"
version = "0.1.0.dev0"
description = "Adhkar IR backend — FastAPI service"
readme = "../README.md"
requires-python = ">=3.12,<3.13"
license = { text = "Apache-2.0" }
authors = [{ name = "The Adhkar IR Authors" }]
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "pydantic>=2.9",
  "pydantic-settings>=2.6",
  "orjson>=3.10",
  "sqlalchemy[asyncio]>=2.0.36",
  "asyncpg>=0.30",
  "alembic>=1.14",
  "structlog>=24.4",
  "httpx>=0.27",
  "redis>=5.2",
  "boto3>=1.35",
  "opentelemetry-api>=1.28",
  "opentelemetry-sdk>=1.28",
  "opentelemetry-exporter-otlp>=1.28",
  "opentelemetry-instrumentation-fastapi>=0.49b0",
  "opentelemetry-instrumentation-sqlalchemy>=0.49b0",
  "opentelemetry-instrumentation-redis>=0.49b0",
  "opentelemetry-instrumentation-httpx>=0.49b0",
  # ----- Phase 1a (identity/RBAC/MFA/auth) -----
  "pyjwt>=2.9",
  "authlib>=1.3",
  "argon2-cffi>=23.1",
  "pyotp>=2.9",
  "qrcode[pil]>=8.0",
  "zxcvbn>=4.4.28",
  "itsdangerous>=2.2",
  "email-validator>=2.2",
  "defusedxml>=0.7.1",
  "python-multipart>=0.0.32",
  "joserfc>=1.7.1",
]

[dependency-groups]
dev = [
  "ruff>=0.7",
  "mypy>=1.13",
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "pytest-cov>=6.0",
  "pytest-randomly>=3.16",
  "respx>=0.21",
  "testcontainers[postgres,redis,minio]>=4.8",
  "polyfactory>=2.18",
  "freezegun>=1.5",
  "openapi-spec-validator>=0.7",
  "types-redis>=4.6",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["adhkar"]

# ----- Ruff -----
[tool.ruff]
target-version = "py312"
line-length = 100
src = ["adhkar", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "C4", "UP", "N", "S", "ASYNC", "RUF"]
ignore = ["S101"]  # allow `assert` in tests (overridden per-dir below for non-tests)

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "N802"]

[tool.ruff.format]
quote-style = "double"

# ----- mypy -----
[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
disallow_any_generics = true
no_implicit_reexport = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["testcontainers.*", "respx.*", "zxcvbn", "qrcode", "qrcode.*"]
ignore_missing_imports = true

# ----- pytest -----
[tool.pytest.ini_options]
asyncio_mode = "strict"
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"
markers = [
  "integration: tests that require external services (testcontainers)",
]
filterwarnings = [
  "error",
]

# ----- coverage -----
[tool.coverage.run]
branch = true
source = ["adhkar"]
omit = ["adhkar/__init__.py"]

[tool.coverage.report]
exclude_lines = [
  "pragma: no cover",
  "raise NotImplementedError",
  "if TYPE_CHECKING:",
]
fail_under = 70
show_missing = true
skip_covered = false
